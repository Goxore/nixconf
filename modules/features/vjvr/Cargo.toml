[package]
name = "vjvr"
version = "0.1.0"
edition = "2024"

[dependencies]
vjcommon = { workspace = true }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
sha2 = "0.11.0"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
